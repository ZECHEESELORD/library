name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build And Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BUNDLE_PATH: build/release/library-${{ github.ref_name }}-jars.zip
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        run: |
          set -euo pipefail

          version="$(grep -E '^version=' gradle.properties | cut -d= -f2-)"

          if [[ -z "$version" ]]; then
            echo "gradle.properties does not define version=..."
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+([.][0-9]+)?$ ]]; then
            echo "Tag '$TAG_NAME' must use vN or vN.P format."
            exit 1
          fi

          if [[ "$TAG_NAME" != "$version" ]]; then
            echo "Tag '$TAG_NAME' does not match gradle.properties version '$version'."
            exit 1
          fi

      - name: Build release bundle
        run: bash ./gradlew build releaseJarBundle --no-daemon --no-watch-fs

      - name: Verify release bundle
        run: |
          set -euo pipefail

          test -s "$BUNDLE_PATH"
          jar tf "$BUNDLE_PATH" | tee release-bundle-contents.txt

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$BUNDLE_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$BUNDLE_PATH" --verify-tag --notes-from-tag --title "$TAG_NAME"
          fi
